name: CCC Bridge check

on:
  pull_request:
    paths:
      - "apps/cognitive-control-coach/**"
      - ".github/workflows/ccc-bridge-check.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cognitive-control-coach
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cognitive-control-coach/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type-check and build
        run: npm run build
