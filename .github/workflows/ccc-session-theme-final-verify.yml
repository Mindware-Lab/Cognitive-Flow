name: Verify final CCC session theme branch

on:
  push:
    branches:
      - feature/ccc-real-life-practice-20260817
    paths:
      - .github/workflows/ccc-session-theme-final-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ccc-real-life-practice-20260817

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cognitive-control-coach/package-lock.json

      - name: Install dependencies
        working-directory: apps/cognitive-control-coach
        run: npm ci

      - name: Run full CCC test suite
        working-directory: apps/cognitive-control-coach
        run: npm test

      - name: Build production bundle
        working-directory: apps/cognitive-control-coach
        run: npm run build

      - name: Check repository whitespace
        run: git diff --check
