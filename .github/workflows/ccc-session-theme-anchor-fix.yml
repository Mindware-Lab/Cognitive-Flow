name: Apply and verify CCC session theme anchor fix

on:
  push:
    branches:
      - feature/ccc-real-life-practice-20260817
    paths:
      - .github/workflows/ccc-session-theme-anchor-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ccc-real-life-practice-20260817
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cognitive-control-coach/package-lock.json

      - name: Apply session-anchor fix
        run: python3 apps/cognitive-control-coach/scripts/fix-session-theme-anchor.py

      - name: Install dependencies
        working-directory: apps/cognitive-control-coach
        run: npm ci

      - name: Run full CCC test suite
        working-directory: apps/cognitive-control-coach
        run: npm test

      - name: Build production bundle
        working-directory: apps/cognitive-control-coach
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cognitive-control-coach/src/main.ts apps/cognitive-control-coach/src/cccRealLifePractice.ts apps/cognitive-control-coach/tests/cccRealLifePractice.test.ts
          git commit -m "Anchor CCC strategic themes to session progression"
          git push origin HEAD:feature/ccc-real-life-practice-20260817
