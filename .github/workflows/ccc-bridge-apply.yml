name: Apply CCC Bridge UI integration

on:
  push:
    branches:
      - feature/ccc-bridge-progression-20260823
    paths:
      - "automation/apply_ccc_bridge_main.py"
      - ".github/workflows/ccc-bridge-apply.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ccc-bridge-progression-20260823
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cognitive-control-coach/package-lock.json
      - name: Apply guarded source transform
        run: python automation/apply_ccc_bridge_main.py
      - name: Install dependencies
        working-directory: apps/cognitive-control-coach
        run: npm ci
      - name: Run full CCC tests
        working-directory: apps/cognitive-control-coach
        run: npm test
      - name: Type-check and build
        working-directory: apps/cognitive-control-coach
        run: npm run build
      - name: Commit tested integration
        run: |
          rm automation/apply_ccc_bridge_main.py
          rm .github/workflows/ccc-bridge-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cognitive-control-coach/src/main.ts automation/apply_ccc_bridge_main.py .github/workflows/ccc-bridge-apply.yml
          git commit -m "Integrate adaptive Bridge progression into CCC UI"
          git push origin HEAD:feature/ccc-bridge-progression-20260823
