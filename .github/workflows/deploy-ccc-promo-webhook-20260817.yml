name: Deploy CCC promo Stripe webhook

on:
  push:
    branches:
      - coach-splash-trident-icon-20260715
    paths:
      - .github/workflows/deploy-ccc-promo-webhook-20260817.yml

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coach-splash-trident-icon-20260715
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cognitive-control-coach/package-lock.json
      - name: Install dependencies
        working-directory: apps/cognitive-control-coach
        run: npm ci
      - name: Run full CCC tests
        working-directory: apps/cognitive-control-coach
        run: npm test
      - name: Build CCC
        working-directory: apps/cognitive-control-coach
        run: npm run build
      - name: Confirm Supabase token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is missing"
            exit 1
          fi
      - name: Deploy Stripe webhook
        working-directory: apps/cognitive-control-coach
        run: npx -y supabase@2.114.0 functions deploy iq-coach-stripe-webhook --project-ref ybnneksunfueetkmjohc
