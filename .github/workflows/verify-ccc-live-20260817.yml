name: Verify live CCC production deployment

on:
  push:
    branches:
      - feature/ccc-real-life-practice-20260817
    paths:
      - .github/workflows/verify-ccc-live-20260817.yml

jobs:
  verify-live:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify live index and production bundle
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://www.iqmindware.com/cognitive-control-coach/'
          EXPECTED_JS='index-DtjDB73z.js'
          for attempt in $(seq 1 24); do
            curl -fsSL --retry 2 --retry-delay 1 "$BASE" -o /tmp/index.html || true
            if grep -q "$EXPECTED_JS" /tmp/index.html 2>/dev/null; then
              echo "Live index is serving $EXPECTED_JS"
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo 'Live index did not update to the expected bundle.' >&2
              cat /tmp/index.html >&2 || true
              exit 1
            fi
            sleep 5
          done
          curl -fsSL --retry 3 --retry-delay 1 "${BASE}assets/${EXPECTED_JS}" -o /tmp/ccc.js
          grep -q 'https://ybnneksunfueetkmjohc.supabase.co' /tmp/ccc.js
          grep -q 'create-iq-coach-checkout-session' /tmp/ccc.js
          grep -q 'claim_my_iq_coach_access' /tmp/ccc.js
          grep -q 'Use the email address from checkout' /tmp/ccc.js
          grep -q 'Real-life practice lens' /tmp/ccc.js
          grep -q 'I’ll try this once' /tmp/ccc.js
          grep -q 'This is a self-report about the strategy' /tmp/ccc.js
          echo 'LIVE_CCC_VERIFICATION=PASS'
