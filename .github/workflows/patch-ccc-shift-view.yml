name: Clean Shift the View release branch

on:
  push:
    branches:
      - fix/ccc-shift-view-protocol-20260813

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: fix/ccc-shift-view-protocol-20260813
          fetch-depth: 0

      - name: Remove temporary release helpers
        run: |
          rm -f apps/cognitive-control-coach/public/ccc-shift-view-v2.js
          rm -f .github/workflows/patch-ccc-shift-view.yml

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cognitive-control-coach/package-lock.json

      - name: Install dependencies
        working-directory: apps/cognitive-control-coach
        run: npm ci

      - name: Run complete test suite
        working-directory: apps/cognitive-control-coach
        run: npm test

      - name: Build production bundle
        working-directory: apps/cognitive-control-coach
        run: npm run build

      - name: Commit cleaned validated source
        run: |
          set -euo pipefail
          git config user.name "Mark Ashton Smith"
          git config user.email "50680966+MarkAshtonSmith@users.noreply.github.com"
          git add -A
          git commit -m "Clean temporary Shift the View release files"
          git push origin HEAD:fix/ccc-shift-view-protocol-20260813
