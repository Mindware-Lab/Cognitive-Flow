<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 120" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Control Coach</title>
  <desc id="desc">Cognitive Control Coach wordmark.</desc>
  <defs>
    <linearGradient id="wordmarkAccent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1267f0"/>
      <stop offset="1" stop-color="#12a08f"/>
    </linearGradient>
    <filter id="softTextShadow" x="-5%" y="-25%" width="110%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#07102d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="980" height="120" fill="transparent"/>
  <g filter="url(#softTextShadow)">
    <text x="8" y="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="0" fill="#07102d">Cognitive Control</text>
    <text x="690" y="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="0" fill="url(#wordmarkAccent)">Coach</text>
  </g>
</svg>